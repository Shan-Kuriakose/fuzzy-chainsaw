[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-engine"
version = "0.1.0"
description = "Generates randomized synthetic personas with synthetic names and demographic attributes."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.coverage.run]
source = ["persona_engine"]

[tool.coverage.report]
fail_under = 80

[tool.setuptools.packages.find]
where = ["src"]
